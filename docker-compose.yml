services:
  app:
    build: .
    container_name: todo-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mongodb://mongo-db:27017/todo-app
      - NODE_ENV=development
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongo-db:
        condition: service_healthy

  mongo-db:
    image: mongo:latest
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
